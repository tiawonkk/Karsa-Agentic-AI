<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="karsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#E8E5DD" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D95D39" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#karsaBg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />

  <!-- Karsa Mascot Body (Squircle) -->
  <g filter="url(#shadow)">
    <rect x="136" y="156" width="240" height="200" rx="72" fill="url(#bodyGrad)" />
  </g>

  <!-- Cute Eyes -->
  <ellipse cx="216" cy="246" rx="14" ry="20" fill="#121212" />
  <ellipse cx="296" cy="246" rx="14" ry="20" fill="#121212" />
  <!-- Eye Highlights -->
  <circle cx="212" cy="240" r="5" fill="#FFFFFF" />
  <circle cx="292" cy="240" r="5" fill="#FFFFFF" />
  <circle cx="222" cy="254" r="2.5" fill="#FFFFFF" />
  <circle cx="302" cy="254" r="2.5" fill="#FFFFFF" />

  <!-- Blushing Cheeks -->
  <ellipse cx="190" cy="272" rx="16" ry="8" fill="#F43F5E" fill-opacity="0.35" />
  <ellipse cx="322" cy="272" rx="16" ry="8" fill="#F43F5E" fill-opacity="0.35" />

  <!-- Cute Smiling Mouth -->
  <path d="M 244 266 Q 256 278 268 266" fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round" />

  <!-- Cute Floating Paws -->
  <ellipse cx="112" cy="270" rx="20" ry="14" fill="#FAF9F6" filter="url(#shadow)" />
  <ellipse cx="400" cy="270" rx="20" ry="14" fill="#FAF9F6" filter="url(#shadow)" />

  <!-- Terracotta Star Accent -->
  <path d="M 256 96 L 262 118 L 284 124 L 262 130 L 256 152 L 250 130 L 228 124 L 250 118 Z" fill="#D95D39" />
</svg>
